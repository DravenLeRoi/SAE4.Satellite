<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SatView</title>
  <script type="importmap">
    {
      "imports": {
        "vue": "https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.esm-browser.js",
        "vue-router": "https://cdnjs.cloudflare.com/ajax/libs/vue-router/4.2.5/vue-router.esm-browser.js",
        "@vue/devtools-api": "https://cdn.jsdelivr.net/npm/@vue/devtools-api@6.5.1/lib/esm/index.js"
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #080c12; --surface: #0e1520; --surf2: #111a28; --border: #1e2d42;
      --accent:  #3b82f6; --accent2: #0ea5e9; --text: #e2eaf4; --muted: #4a6280;
      --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
      --mono: 'Space Mono', monospace; --display: 'Syne', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--display); min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px; opacity: 0.3; pointer-events: none; z-index: 0;
    }
    #app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* NAV */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 60px; border-bottom: 1px solid var(--border);
      background: rgba(8,12,18,0.9); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 0.65rem;
      font-weight: 800; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em;
      text-decoration: none; color: var(--text);
    }
    .logo-ring {
      width: 28px; height: 28px; border: 2px solid var(--accent); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 12px;
      animation: spin 14s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .nav-links { display: flex; gap: 0.25rem; }
    .nav-link {
      padding: 0.4rem 0.85rem; border-radius: 3px; font-family: var(--mono); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.1em; text-decoration: none; color: var(--muted);
      border: 1px solid transparent; transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .nav-link:hover { color: var(--text); background: var(--surf2); }
    .nav-link.router-link-active { color: var(--accent2); border-color: var(--border); background: var(--surface); }
    .nav-status { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 0.65rem; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
    .dot-ok { background: var(--success); box-shadow: 0 0 5px var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* PAGE */
    .page { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
    .fade-enter-active, .fade-leave-active { transition: opacity 0.2s, transform 0.2s; }
    .fade-enter-from { opacity: 0; transform: translateY(8px); }
    .fade-leave-to   { opacity: 0; }

    /* COMMUN */
    .section-title {
      font-size: 0.65rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--muted); margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .section-title::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 1px; display: inline-block; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 2px;
      font-family: var(--mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .badge-ok      { background: rgba(34,197,94,.1);  color: var(--success); border: 1px solid rgba(34,197,94,.3); }
    .badge-warn    { background: rgba(245,158,11,.1); color: var(--warning); border: 1px solid rgba(245,158,11,.3); }
    .badge-error   { background: rgba(239,68,68,.1);  color: var(--danger);  border: 1px solid rgba(239,68,68,.3); }
    .badge-neutral { background: rgba(74,98,128,.1);  color: var(--muted);   border: 1px solid var(--border); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 0.55rem 1rem;
      background: transparent; border: 1px solid var(--accent); border-radius: 3px;
      color: var(--accent); font-family: var(--mono); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }
    .btn:hover { background: rgba(59,130,246,.1); color: var(--text); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.62rem; }
    .btn-ghost { border-color: var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
    input, select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
      color: var(--text); font-family: var(--mono); font-size: 0.72rem;
      padding: 0.5rem 0.75rem; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }
    select option { background: var(--surface); }
    footer { text-align: center; padding: 0.9rem; font-family: var(--mono); font-size: 0.6rem; color: var(--muted); border-top: 1px solid var(--border); }
    .empty-state { text-align: center; padding: 3rem 1rem; font-family: var(--mono); color: var(--muted); font-size: 0.75rem; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }

    /* ACCUEIL */
    .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2.5rem; align-items: center; padding: 2rem 0; }
    @media (max-width: 700px) { .hero { grid-template-columns: 1fr; } }
    .hero-label { font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent2); margin-bottom: 0.75rem; }
    .hero-title { font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 800; line-height: 1.1; margin-bottom: 1.25rem; }
    .hero-title span { color: var(--accent2); }
    .hero-desc { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); line-height: 1.8; margin-bottom: 1.5rem; }
    .hero-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .hero-visual { display: flex; align-items: center; justify-content: center; }
    .orbit-svg { width: 100%; max-width: 300px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1.1rem 1.25rem; position: relative; overflow: hidden; }
    .stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); }
    .stat-label { font-family: var(--mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
    .stat-value { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .stat-value.green { color: var(--success); } .stat-value.blue { color: var(--accent2); } .stat-value.amber { color: var(--warning); }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem; transition: border-color 0.2s; }
    .feature-card:hover { border-color: var(--accent); }
    .feature-icon { font-size: 1.4rem; margin-bottom: 0.75rem; }
    .feature-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; }
    .feature-desc { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); line-height: 1.7; }

    /* SATELLITES */
    .sat-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .sat-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .sat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem; display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: start; transition: border-color 0.2s; }
    .sat-card:hover { border-color: rgba(59,130,246,.4); }
    .sat-indicator { width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background: var(--surf2); flex-shrink: 0; }
    .sat-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.3rem; }
    .sat-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .sat-detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.4rem; margin-top: 0.75rem; }
    .sat-detail { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); }
    .sat-detail span { color: var(--text); }
    .sat-actions { display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-end; flex-shrink: 0; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(8,12,18,.85); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .modal-title { font-size: 1rem; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; transition: color 0.2s; padding: 4px 8px; }
    .modal-close:hover { color: var(--text); }
    .form-row { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.9rem; }
    .form-row label { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .form-row input, .form-row select, .form-row textarea { width: 100%; }
    .form-row textarea { resize: vertical; min-height: 80px; font-family: var(--mono); font-size: 0.72rem; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; color: var(--text); padding: 0.5rem 0.75rem; outline: none; }
    .form-row textarea:focus { border-color: var(--accent); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
    .form-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }

    /* FICHIERS */
    .files-toolbar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .files-toolbar .spacer { flex: 1; }
    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .file-card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.15s; }
    .file-card:hover { border-color: var(--accent2); transform: translateY(-2px); }
    .file-thumb { width: 100%; aspect-ratio: 4/3; background: var(--surf2); object-fit: cover; display: block; }
    .file-thumb-placeholder { width: 100%; aspect-ratio: 4/3; background: var(--surf2); display: flex; align-items: center; justify-content: center; font-size: 2rem; opacity: 0.3; }
    .file-info { padding: 0.75rem; }
    .file-name { font-family: var(--mono); font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.3rem; color: var(--text); }
    .file-meta-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.65rem; color: var(--muted); }
    .file-table { width: 100%; border-collapse: collapse; }
    .file-table th { font-family: var(--mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
    .file-table td { padding: 0.65rem 0.75rem; font-family: var(--mono); font-size: 0.7rem; border-bottom: 1px solid rgba(30,45,66,.5); vertical-align: middle; }
    .file-table tr:last-child td { border-bottom: none; }
    .file-table tr:hover td { background: rgba(59,130,246,.04); }
    .view-toggle { display: flex; gap: 2px; }
    .view-btn { padding: 0.35rem 0.6rem; background: var(--bg); border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 0.75rem; transition: color 0.2s, background 0.2s; }
    .view-btn:first-child { border-radius: 3px 0 0 3px; }
    .view-btn:last-child  { border-radius: 0 3px 3px 0; border-left: none; }
    .view-btn.active { background: var(--surface); color: var(--accent2); border-color: var(--accent); }
    .viewer-overlay { position: fixed; inset: 0; background: rgba(5,8,14,.97); z-index: 200; display: flex; flex-direction: column; }
    .viewer-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--surface); }
    .viewer-title { font-family: var(--mono); font-size: 0.75rem; color: var(--accent2); }
    .viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1rem; overflow: hidden; }
    .viewer-img { max-width: 100%; max-height: 100%; object-fit: contain; border: 1px solid var(--border); }
    .viewer-footer { display: flex; align-items: center; justify-content: center; gap: 1.5rem; padding: 0.75rem; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 0.65rem; color: var(--muted); background: var(--surface); flex-wrap: wrap; }
  </style>
</head>
<body>
<div id="app">
  <nav>
    <router-link to="/" class="nav-logo">
      <div class="logo-ring">◎</div>SatView
    </router-link>
    <div class="nav-links">
      <router-link to="/"           class="nav-link">Accueil</router-link>
      <router-link to="/satellites" class="nav-link">Satellites</router-link>
      <router-link to="/fichiers"   class="nav-link">Fichiers</router-link>
    </div>
    <div class="nav-status">
      <div class="dot dot-ok"></div>Système actif
    </div>
  </nav>

  <router-view v-slot="{ Component }">
    <transition name="fade" mode="out-in">
      <component :is="Component" />
    </transition>
  </router-view>

  <footer>Clément Raimbaud, Ajami Sammer • BUT GEII Toulon, La Garde • SAÉ4</footer>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
